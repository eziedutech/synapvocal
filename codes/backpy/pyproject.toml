[project]
name = "synapvocal-backpy"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "google-genai==2.23.0",
    "sqlalchemy==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "boto3==1.43.97",
    "python-multipart==0.0.32",
]
# websockets resolves to 16.1.1, not the latest 17.1: google-genai 2.23.0 requires
# websockets<17.0. backpy does not use websockets directly (uvicorn does).

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
