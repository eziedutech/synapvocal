[project]
name = "synapvocal-backpy"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "google-genai==2.23.0",
]
# websockets resolves to 16.1.1, not the latest 17.1: google-genai 2.23.0 requires
# websockets<17.0. backpy does not use websockets directly (uvicorn does).

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
