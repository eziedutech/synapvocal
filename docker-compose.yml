# Local mirror of production: frontrouter is the only published port,
# backpy is reachable only on the compose network, like the Dokploy internal host.
#
#   GIT_SHA=$(git rev-parse --short HEAD) docker compose up --build
#   then open http://localhost:3310

services:
  # Local stand-in for the Postgres service on the Dokploy server. Only for voluntary
  # contributions; the Bridge works without it.
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: synapvocal
      POSTGRES_USER: synapvocal
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "synapvocal", "-d", "synapvocal"]
      interval: 5s
      timeout: 3s
      retries: 10

  backpy:
    build:
      context: ./codes/backpy
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      APP_ENV: local
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-synapvocal-backpy.json
      DATABASE_URL: postgresql+asyncpg://synapvocal:${LOCAL_POSTGRES_PASSWORD:-local-only}@postgres:5432/synapvocal
      # Recordings stay on this machine locally, in a named volume; production uses S3.
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /data/contributions
    env_file:
      - path: .env
        required: false
    volumes:
      # Service account key for Vertex AI, mounted read-only, never baked into the image.
      - ./credentials/gcp-synapvocal-backpy.json:/run/secrets/gcp-synapvocal-backpy.json:ro
      - contributions-data:/data/contributions
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontrouter:
    build:
      context: ./codes/frontrouter
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      APP_ENV: local
      BACKPY_INTERNAL_URL: http://backpy:8000
    env_file:
      - path: .env
        required: false
    ports:
      # 3000 is often taken by other local projects on this machine.
      - "${FRONT_PORT:-3310}:3000"
    depends_on:
      backpy:
        condition: service_healthy

volumes:
  postgres-data:
  contributions-data:
